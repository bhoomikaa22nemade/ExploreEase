<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – ExploreEase</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div class="canvas">
    <section class="contact">
      <h1>Contact Us</h1>
      <p class="lead">
        We’d love to hear from you. Whether you have questions, feedback, or want help planning your next trip — we’re here for you.
      </p>
      <form id="contactForm">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email Address" required />
        <input type="tel" placeholder="Phone Number" required />
        <input type="text" placeholder="Destination Interested In" required />
        <textarea placeholder="Your Message" rows="4" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </section>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("✅ Your response has been recorded. We will get back to you shortly.");
      this.reset();
    });
  </script>
</body>
</html>
